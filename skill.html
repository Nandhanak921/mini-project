<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #c9eaf1;
      /* margin: 0;
      padding: 0; */
    }

    .skills-section {
      text-align: center;
      padding: 60px 20px;
    }

    .skills-section h2 {
      color: #056669;
      font-size: 40px;
      margin-bottom: 30px;
    }

    .skills-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    .skill-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, 0.3s ease;
      cursor: pointer;
    }

    .skill-card:hover {
      transform: translateY(-8px) scale(1.05);
      background-color: #056669;
      color: white;
    }

    .skill-card h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }
    h2{
      font-size: 40px;
    }
  </style>
</head>
<body>

  <section class="skills-section">
    <h2>SKILLS</h2>
    <div class="skills-container">
      <div class="skill-card"><h3>Python</h3></div>
      <div class="skill-card"><h3>Java</h3></div>
      <div class="skill-card"><h3>PHP</h3></div>
      <div class="skill-card"><h3>JavaScript</h3></div>
      <div class="skill-card"><h3>React</h3></div>
      <div class="skill-card"><h3>Node.js</h3></div>
      <div class="skill-card"><h3>MongoDB</h3></div>
      <div class="skill-card"><h3>HTML & CSS</h3></div>
      <div class="skill-card"><h3>Django</h3></div>
    </div>
  </section>

</body>
</html>
